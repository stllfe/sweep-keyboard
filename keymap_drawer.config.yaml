# Стиль схемы для keymap-drawer.
# Справка по полям: github.com/caksoylar/keymap-drawer/blob/main/CONFIGURATION.md
draw_config:
  dark_mode: auto
  key_w: 64
  key_h: 60
  split_gap: 40
  combo_w: 26
  combo_h: 24
  footer_text: ''
  svg_extra_style: '/* русская буква в правом верхнем углу */

    text.tr { fill: #4a8ff0; font-size: 13px; font-weight: 600; }

    /* подписи модификаторов при удержании */

    text.hold { font-size: 13px; }

    /* буквы комбо крупнее */

    text.combo { font-size: 13px; font-weight: 600; }

    '
  n_columns: 2
parse_config:
  raw_binding_map:
    '&kp LANG2': {t: 英数, h: тест}
    '&kp GLOBE': {t: 🌐, h: тест}
    '&hml LSHFT A':
      t: A
      tr: ф
      h: ⇧
    '&hml LCTRL S':
      t: S
      tr: ы
      h: ⌃
    '&hml LALT D':
      t: D
      tr: в
      h: ⌥
    '&hml LGUI F':
      t: F
      tr: а
      h: ⌘
    '&hmr RGUI J':
      t: J
      tr: о
      h: ⌘
    '&hmr RALT K':
      t: K
      tr: л
      h: ⌥
    '&hmr RCTRL L':
      t: L
      tr: д
      h: ⌃
    '&hmr RSHFT SQT':
      t: ''''
      tr: э
      h: ⇧
    '&bootloader': Boot
    '&sys_reset': Reset
    '&studio_unlock': Studio
    '&caps_word': Caps
    '&kp LS(N1)': '!'
    '&kp LS(N2)': '"'
    '&kp LS(N4)': ;
    '&kp LS(N5)': '%'
    '&kp LS(N6)': ':'
    '&kp LS(N7)': '?'
    '&kp LS(N8)': '*'
    '&kp LS(N9)': (
    '&kp LS(N0)': )
    '&kp LS(MINUS)': _
    '&kp LS(EQUAL)': +
    '&kp LS(BSLH)': /
    '&kp LS(FSLH)': ','
    '&en AMPS':
      t: '&'
      h: →EN
    '&en HASH':
      t: '#'
      h: →EN
    '&en CARET':
      t: ^
      h: →EN
    '&en AT':
      t: '@'
      h: →EN
    '&en LBKT':
      t: '['
      h: →EN
    '&en RBKT':
      t: ']'
      h: →EN
    '&en LT':
      t: <
      h: →EN
    '&en GT':
      t: '>'
      h: →EN
    '&en DLLR':
      t: $
      h: →EN
    '&en TILDE':
      t: '~'
      h: →EN
    '&en GRAVE':
      t: '`'
      h: →EN
    '&en PIPE':
      t: '|'
      h: →EN
    '&en LBRC':
      t: '{'
      h: →EN
    '&en RBRC':
      t: '}'
      h: →EN
    '&kp LA(LS(MINUS))': —
    '&lang': язык
    '&tog 1':
      t: Ru
      h: флаг
  trans_legend: ''
  zmk_combos:
    combo_lang:
      k: язык
      l:
      - Base
    combo_yo:
      k: ё
      l:
      - Base
    combo_hard:
      k: ъ
      l:
      - Base
    combo_kha:
      k: х
      l:
      - Base
    combo_comma_en:
      k: ','
      l:
      - Base
    combo_comma_ru:
      hidden: true
  zmk_keycode_map:
    EXCLAMATION: '!'
    EXCL: '!'
    AT_SIGN: '@'
    AT: '@'
    HASH: '#'
    POUND: '#'
    DOLLAR: $
    DLLR: $
    PERCENT: '%'
    PRCNT: '%'
    CARET: ^
    AMPERSAND: '&'
    AMPS: '&'
    ASTERISK: '*'
    ASTRK: '*'
    STAR: '*'
    LEFT_PARENTHESIS: (
    LPAR: (
    RIGHT_PARENTHESIS: )
    RPAR: )
    EQUAL: '='
    PLUS: +
    MINUS: '-'
    UNDERSCORE: _
    UNDER: _
    SLASH: /
    FSLH:
      t: /
      tr: .
    QUESTION: '?'
    QMARK: '?'
    BACKSLASH: \
    BSLH: \
    PIPE: '|'
    NON_US_BACKSLASH: \
    PIPE2: '|'
    NON_US_BSLH: '|'
    SEMICOLON: ;
    SEMI: ;
    COLON: ':'
    SINGLE_QUOTE:
      t: ''''
      tr: э
    SQT:
      t: ''''
      tr: э
    APOSTROPHE: ''''
    APOS: ''''
    DOUBLE_QUOTES: '"'
