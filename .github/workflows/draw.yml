name: Draw keymap
on:
  push:
    paths: ["config/*.keymap", "keymap_drawer.config.yaml"]
  workflow_dispatch:

jobs:
  draw:
    uses: caksoylar/keymap-drawer/.github/workflows/draw-zmk.yml@main
    permissions:
      contents: write
    with:
      keymap_patterns: "config/*.keymap"
      output_folder: "keymap-drawer"
      parse_args: "cradio:'-l Base Ru Zh Nav Sym SymRu Sys'"
      draw_args: "cradio:'-s Base Nav Sym SymRu Sys'"
